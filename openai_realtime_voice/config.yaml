name: GPT Live Voice
version: "2.2.2"
slug: openai_realtime_voice
description: WebSocket bridge from Voice PE to OpenAI GPT Live (natural voice conversation with web search)
url: https://github.com/metintaski-cloud/ha-openai-realtime-voice
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
homeassistant_api: true
options:
  openai_api_key: ""
  websocket_port: 8080
  instructions: "Du bist eine warme, freundliche und natürlich klingende Sprachassistentin im Wohnzimmer. Sprich immer in der Sprache, in der du angesprochen wirst, meistens Türkisch oder Deutsch. Sprich lebendig und menschlich, mit natürlicher Betonung, und antworte kurz. Wenn sich jemand verabschiedet oder das Gespräch beenden möchte, verabschiede dich kurz und beende das Gespräch."
  voice: "marin"
  live_model: "gpt-live-1"
  backend_model: "gpt-5.6-luna"
  enable_web_search: true
  enable_memory: true
  enable_context: true
  memory_model: "gpt-6-luna"
  enable_recording: false
schema:
  openai_api_key: password
  websocket_port: int(1024,65535)
  instructions: str
  voice: str
  live_model: str
  backend_model: str
  enable_web_search: bool
  enable_memory: bool
  enable_context: bool
  memory_model: str
  enable_recording: bool
