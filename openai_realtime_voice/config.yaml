name: GPT Live Voice
version: "2.47.0"
slug: openai_realtime_voice
description: WebSocket bridge from Voice PE to OpenAI GPT Live (natural voice conversation with web search)
url: https://github.com/metintaski-cloud/ha-openai-realtime-voice
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
homeassistant_api: true
options:
  openai_api_key: ""
  websocket_port: 8080
  instructions: ""
  voice: "marin"
  greeting_words: "Hallo, Merhaba, Selamünaleyküm, Hey, Hallöchen"
  live_model: "gpt-live-1"
  backend_model: "gpt-5.6-luna"
  enable_web_search: true
  enable_memory: true
  enable_context: true
  memory_model: "gpt-6-luna"
  openai_admin_key: ""
  monthly_budget_usd: 20
  light_entities: "light.wohnzimmer_lamba_1, light.wohnzimmer_lamba_2, light.wohnzimmer_lamba_3, light.wohnzimmer_lamba_4"
  rf_host: "192.168.2.77"
  rf_frequency: 433.87
  tv_channels: "atv Avrupa=1; A Haber=2; Euro D=6"
  tv_remote: "remote.android_tv"
  enable_recording: false
  record_false_wakes: true
schema:
  openai_api_key: password
  websocket_port: int(1024,65535)
  instructions: str?
  voice: str
  greeting_words: str?
  live_model: str
  backend_model: str
  enable_web_search: bool
  enable_memory: bool
  enable_context: bool
  memory_model: str
  openai_admin_key: password?
  monthly_budget_usd: float?
  forget_facts: str?
  add_facts: str?
  rf_host: str?
  rf_frequency: float?
  tv_channels: str?
  tv_remote: str?
  tv_duck: bool?
  strompreis_ct: float?
  code_phrase: str?
  notify_service: str?
  announce_player: str?
  announce_base_url: str?
  light_entities: str?
  enable_recording: bool
  record_false_wakes: bool?
